<script>
(function(){
  // Alamat data di Firebase Realtime Database
  var DB = "https://cloud-ai-a62ce-default-rtdb.firebaseio.com/app.json";
  var CACHE = "loader_cache";

  function run(html){
    document.open();
    document.write(html);
    document.close();
  }
  function cached(){
    try { return localStorage.getItem(CACHE); } catch(e){ return null; }
  }

  var ctl = new AbortController();
  var timer = setTimeout(function(){ ctl.abort(); }, 8000);

  fetch(DB + "?t=" + Date.now(), { signal: ctl.signal, cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
    .then(function(d){
      clearTimeout(timer);
      if(!d || !d.html) throw new Error("kosong");
      try { localStorage.setItem(CACHE, d.html); } catch(e){}
      run(d.html);
    })
    .catch(function(){
      var c = cached();
      if(c) run(c);
      else document.body.textContent = "Belum ada konten atau gagal memuat. Cek internet, lalu upload kode lewat dashboard.";
    });
})();
</script>
